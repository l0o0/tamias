<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <title>小花鼠 Tamias · 吃坚果的小花鼠</title>
  <style>
    .tm-eat-tail { transform-origin: 77px 135px; animation: tm-eat-tail 3200ms ease-in-out infinite; }
    .tm-eat-head { transform-origin: 115px 87px; animation: tm-nibble 1600ms ease-in-out infinite; }
    .tm-eat-hands { animation: tm-lift-nut 1600ms ease-in-out infinite; }
    .tm-eat-crumb { opacity: 0; animation: tm-crumb 1600ms ease-out infinite; }
    .tm-eat-crumb-late { animation-delay: 190ms; }
    @keyframes tm-eat-tail {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-3deg); }
    }
    @keyframes tm-lift-nut {
      0%, 78%, 100% { transform: translate(0, 0); }
      22%, 56% { transform: translate(-1px, -4px); }
      38%, 66% { transform: translate(0, -2px); }
    }
    @keyframes tm-nibble {
      0%, 16%, 76%, 100% { transform: rotate(0deg); }
      28%, 52% { transform: rotate(4deg); }
      40%, 64% { transform: rotate(1deg); }
    }
    @keyframes tm-crumb {
      0%, 32% { opacity: 0; transform: translate(0, 0); }
      38% { opacity: .85; }
      66%, 100% { opacity: 0; transform: translate(4px, 13px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tm-eat-tail, .tm-eat-head, .tm-eat-hands, .tm-eat-crumb { animation: none !important; }
    }
  </style>
  <g fill="#252629">
    <g class="tm-eat-tail">
      <path d="M28 36C47 10 76 14 89 38C103 65 91 83 68 101C71 86 82 77 82 60C83 32 53 13 28 36Z"/>
      <path d="M26 64C14 59 16 43 27 35C44 22 66 32 72 51C81 75 64 91 59 109C54 127 66 140 83 144C63 150 42 140 33 125C21 105 32 91 40 76C51 54 30 46 26 64Z"/>
    </g>
    <path d="M67 120C65 103 73 91 88 87C101 83 106 78 109 68C113 81 107 89 94 93C79 97 71 107 67 120Z"/>
    <path d="M76 141C62 126 71 108 87 102C103 97 108 93 111 84L122 87C123 99 126 102 123 111C121 117 118 122 114 124C113 118 107 113 98 113C115 119 119 132 110 141C120 140 129 144 128 148H101C90 150 82 148 76 141Z"/>
    <path d="M65 138C76 144 92 144 107 142L113 148C94 150 74 152 61 146Z"/>
    <g class="tm-eat-head">
      <path fill-rule="evenodd" d="M111 87C116 77 108 69 109 61C109 56 111 53 113 53C118 53 123 58 124 64C136 66 138 74 144 78C150 82 145 87 137 90C128 94 118 95 111 87ZM133 75C129 71 126 74 128 78C131 82 136 80 133 75Z"/>
    </g>
    <g class="tm-eat-hands">
      <!-- Enlarged original acorn, with transparent shell seam and highlight. -->
      <g transform="translate(0 7)">
      <g transform="translate(135 100) scale(1.25) rotate(15) translate(-135 -100)">
        <path fill-rule="evenodd" d="M127 101C126 106 130 112 135 114C141 112 145 106 143 101ZM130 103C129 107 131 110 134 112L136 110C133 108 132 106 133 103Z"/>
        <path d="M126 95C126 88 142 87 145 95C141 99 130 99 126 95Z"/>
        <path d="M135 91L136 89" stroke="#252629" stroke-width="3" stroke-linecap="round"/>
      </g>
      <path d="M116 95C121 92 124 96 128 100C131 102 135 101 136 104C136 108 129 109 125 106L116 102Z"/>
      <path d="M148 98C153 99 151 106 146 109L141 109C138 107 141 104 144 103Z"/>
      </g>
    </g>
  </g>
  <g fill="#252629">
    <circle class="tm-eat-crumb" cx="146" cy="99" r="1.5"/>
    <circle class="tm-eat-crumb tm-eat-crumb-late" cx="143" cy="101" r="1"/>
  </g>
</svg>
