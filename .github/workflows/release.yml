name: Release installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag without v (for example 0.2.0-beta.2)
        required: true
        type: string
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version)) || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) version="$REQUESTED_VERSION" ;;
            release) version="${RELEASE_TAG#v}" ;;
            push) version="${GITHUB_REF_NAME#v}" ;;
            *) echo 'Unsupported release event' >&2; exit 1 ;;
          esac
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Use a semantic version such as 0.2.0 or 0.2.0-beta.2 (without build metadata)' >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            IFS=. read -ra identifiers <<< "${version#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo 'Numeric prerelease identifiers cannot have leading zeroes' >&2
                exit 1
              fi
            done
          fi
          if [[ "$GITHUB_EVENT_NAME" == release && "$RELEASE_TAG" != "v$version" ]]; then
            echo 'Release tag must start with v' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Pin all builds to the tagged commit
        id: source
        run: |
          source_sha="$(git rev-parse HEAD^{commit})"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            test "$source_sha" = "$(git rev-parse "$GITHUB_SHA^{commit}")" || {
              echo 'Release tag changed after this event was created' >&2
              exit 1
            }
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: amd64
          - runner: windows-2022
            platform: windows
            arch: amd64
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
      BUILD_NUMBER: ${{ github.run_number }}
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config patchelf squashfs-tools desktop-file-utils libfuse2t64 xvfb dbus-x11 dpkg-dev python3 bubblewrap xdg-dbus-proxy apparmor
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test core and CLI
        run: go test -race ./internal/... ./cmd/tami
      - name: Static checks
        run: go vet ./internal/... ./cmd/tami
      - name: Build desktop and CLI
        shell: bash
        run: |
          sh scripts/build-desktop.sh
          sh scripts/build-cli.sh
          test "$(bin/cli/tamias$(go env GOEXE) -version)" = "$VERSION"
      - name: Package macOS installer
        if: runner.os == 'macOS'
        run: sh scripts/package-macos.sh
      - name: Verify macOS installer payload
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict bin/tamias.app
          plutil -lint bin/tamias.app/Contents/Info.plist
          sudo installer -pkg "dist/tamias-${VERSION}-macos-${ARCH}.pkg" -target /
          test "$(/Applications/tamias.app/Contents/MacOS/tamias -version)" = "$VERSION"
          test -f /Applications/tamias.app/Contents/Resources/LICENSE
          test -f /Applications/tamias.app/Contents/Resources/THIRD_PARTY_NOTICES.txt
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-installer.ps1
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: bash scripts/package-linux.sh
      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        run: sh scripts/verify-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*-setup.exe
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Publish installers and checksums
        run: bash scripts/publish-release.sh
      - name: Release summary
        run: |
          {
            echo '## Installers published'
            echo
            echo "Version: v$VERSION · Commit: $SOURCE_SHA"
            echo
            echo "[Download installers](https://github.com/$GH_REPO/releases/tag/v$VERSION)"
            echo
            echo '- Windows x64: setup.exe'
            echo '- macOS Apple Silicon and Intel: .pkg'
            echo '- Linux x64: .AppImage'
            echo '- SHA256SUMS.txt'
          } >> "$GITHUB_STEP_SUMMARY"
