<body>
<h1>欢迎安装小花鼠 Tamias</h1>
<p>安装程序会将小花鼠 Tamias 安装到“应用程序”文件夹。请先退出正在运行的小花鼠、Tamias 或旧版 tamiops，再继续安装或升级。</p>
<p>安装程序只替换应用本身。用户配置、凭据和数据保存在 <code>~/Library/Application Support/Tami</code>，不会被安装或升级过程覆盖。</p>
</body>
